[project]
name = "git-default-branch"
version = "0.1.0"
description = "Tells which branch is a git repository's default, the same way for every tool that needs to know."
requires-python = ">=3.13"
dependencies = ["cli-kit"]

[project.scripts]
git-default-branch = "git_default_branch.__main__:main"

[tool.uv.sources]
cli-kit = { git = "https://github.com/ianflanagan1/cli-kit", branch = "main" }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
